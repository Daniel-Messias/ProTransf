<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #5fbdf2;
      --background: #0d1b2a;
      --surface: #1b263b;
      --text: #ffffff;
      --text-muted: #cccccc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--background);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background-color: #0a192f;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
    }

    .logo span {
      color: var(--primary);
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      margin: 0 15px;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--primary);
    }

    .btn-login {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-login:hover {
      background-color: var(--primary);
      color: #000;
    }

    main {
      padding: 40px 20px;
    }

    .hero {
      max-width: 400px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 32px;
      text-align: center;
      margin-bottom: 8px;
    }

    .hero h2 {
      color: var(--primary);
      text-align: center;
      font-size: 18px;
      margin-bottom: 32px;
    }

    .formulario {
      background-color: var(--surface);
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background-color: #243447;
      color: var(--text);
      font-size: 14px;
    }

    .form-input:focus {
      outline: 2px solid var(--primary);
    }

    .form-actions {
      text-align: center;
      margin-top: 24px;
    }

    .btn-secondary {
      display: inline-block;
      padding: 10px 20px;
      background-color: var(--primary);
      color: #000;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: #4fa9dd;
    }

    .error-msg {
      font-size: 13px;
      color: #ff5c5c;
      margin-top: 4px;
      display: block;
    }

    .link-cadastro {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
    }

    .link-cadastro a {
      color: var(--primary);
      text-decoration: none;
    }

    .link-cadastro a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Pro<span>Transf</span></div>
    <nav>
      <a href="ProTransf.html">Início</a>
      <a href="cadastro.html">Cadastrar-se</a>
    </nav>
    <button class="btn-login">Entrar</button>
  </header>

  <main>
    <section class="hero">
      <h1>Bem-vindo de volta!</h1>
      <h2>Faça login para continuar</h2>

      <form id="loginForm" class="formulario" novalidate>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" class="form-input" required />
          <span class="error-msg" id="erro-email"></span>
        </div>

        <div class="form-group">
          <label for="senha">Senha:</label>
          <input type="password" id="senha" name="senha" class="form-input" required />
          <span class="error-msg" id="erro-senha"></span>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-secondary">Entrar</button>
        </div>

        <div class="link-cadastro">
          Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
        </div>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      let isValid = true;

      const email = document.getElementById('email');
      const erroEmail = document.getElementById('erro-email');
      const emailRegex = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
      if (!emailRegex.test(email.value.trim())) {
        erroEmail.textContent = 'Digite um email válido.';
        isValid = false;
      } else {
        erroEmail.textContent = '';
      }

      const senha = document.getElementById('senha');
      const erroSenha = document.getElementById('erro-senha');
      if (senha.value.length < 6) {
        erroSenha.textContent = 'A senha deve ter pelo menos 6 caracteres.';
        isValid = false;
      } else {
        erroSenha.textContent = '';
      }

      if (isValid) {
        alert('Login realizado com sucesso!');
        
      }
    });
  </script>
</body>
</html>
